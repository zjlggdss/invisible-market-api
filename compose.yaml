name: invisible-market

services:
  api:
    build: .
    env_file: .env
    environment:
      HOST: 0.0.0.0
      DATA_DIR: /app/data
      PORT_UPLOAD: 3101
      PORT_BEST: 3102
      PORT_WORST: 3103
      PORT_REPORT: 3104
    volumes:
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    networks:
      - internal

  gateway:
    image: nginx:stable-alpine
    depends_on:
      - api
    ports:
      - "3101:3101"
      - "3102:3102"
      - "3103:3103"
      - "3104:3104"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped
    networks:
      - internal

networks:
  internal:
    driver: bridge
