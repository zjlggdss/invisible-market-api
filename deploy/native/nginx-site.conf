limit_req_zone $binary_remote_addr zone=market_upload:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=market_read:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=market_owner:10m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=market_connections:10m;

server {
    listen 3101 ssl;
    server_tokens off;
    client_max_body_size 85m;
    ssl_certificate /opt/invisible-market/certs/fullchain.pem;
    ssl_certificate_key /opt/invisible-market/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    limit_req_status 429;
    limit_conn_status 429;
    client_body_timeout 15s;
    location / {
        limit_req zone=market_upload burst=5 nodelay;
        limit_conn market_connections 4;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:4101;
    }
}

server {
    listen 3102 ssl;
    server_tokens off;
    ssl_certificate /opt/invisible-market/certs/fullchain.pem;
    ssl_certificate_key /opt/invisible-market/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    limit_req_status 429;
    limit_conn_status 429;
    location / {
        limit_req zone=market_read burst=10 nodelay;
        limit_conn market_connections 6;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:4102;
    }
}

